<!DOCTYPE html>
<!-- Página que ve el cliente después de enviar la ficha. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ficha enviada · Marcos Bustamante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center;
      background: #0B0B0D; color: #FFFFFF;
      font-family: "Barlow", system-ui, sans-serif; font-size: 17px; line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    .marca-sub {
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: #FFD400;
    }
    h1 {
      font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
      font-size: 40px; line-height: 1.05; margin: 16px 0;
    }
    p { color: #C9CDD6; margin: 0 0 16px; }
    .nota { border-left: 4px solid #FFD400; padding-left: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="marca-sub">Marcos Bustamante · Fisio deportivo · Entrenamiento</div>
    <h1>Ficha recibida</h1>
    <p>Gracias. Leo tu caso antes de la primera sesión para llegar con un plan.</p>
    <p class="nota">Si tienes pruebas (resonancia, radiografía), tráelas el día de la consulta. Si algo empeora antes, escríbeme por WhatsApp.</p>
  </main>
</body>
</html>
